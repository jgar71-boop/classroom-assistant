# Blueprint de Render para el Classroom Assistant.
# El servicio se llama igual que el repositorio, para no actualizar por error un
# servicio que ya exista en la cuenta.
services:
  - type: web
    name: classroom-assistant
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    # Publica solo si el pipeline de CI pasa
    autoDeployTrigger: checksPass
    envVars:
      # Con production se aplican las reglas de compliance al arrancar
      - key: ENVIRONMENT
        value: production
      - key: MODEL_PROVIDER
        value: gateway
      - key: HIDE_INPUTS
        value: "true"
      - key: HIDE_OUTPUTS
        value: "true"
      - key: RATE_LIMIT_PER_MINUTE
        value: "30"
      # Secretos: se escriben en Render al crear el Blueprint, nunca aquí.
      # La clave de LangSmith es opcional y se agrega en Render > Environment
      # solo si se encienden las trazas.
      - key: API_KEYS
        sync: false
      - key: CF_ACCOUNT_ID
        sync: false
      - key: CF_API_TOKEN
        sync: false
      # Opcional: token del AI Gateway, se envía como cf-aig-authorization
      - key: CF_AIG_TOKEN
        sync: false
